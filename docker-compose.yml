name: cebp-platform

services:
  # ==========================================================================
  # SHARED INFRASTRUCTURE (Run with: `docker compose up -d redpanda redpanda-console core-postgres`)
  # ==========================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: cebp-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --pandaproxy-addr internal://0.0.0.0:28082,external://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda:28082,external://localhost:8082
      - --schema-registry-addr internal://0.0.0.0:28081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "9092:9092"
      - "18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: cebp-kafka-ui
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092

  # Single Source of Truth (SSOT) Database — ONLY accessed by `core-management-service`
  core-postgres:
    image: postgres:16-alpine
    container_name: cebp-core-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_db}
      POSTGRES_USER: ${POSTGRES_USER:-cebp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cebp_secret}
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cebp -d core_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # APPLICATION MICROSERVICES (Full Container Deployment Profile)
  # ==========================================================================
  core-management-service:
    build:
      context: .
      dockerfile: core-management-service/Dockerfile
    container_name: cebp-core-management
    profiles: ["full"]
    depends_on:
      redpanda:
        condition: service_healthy
      core-postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-postgres:5432/core_db
      SPRING_DATASOURCE_USERNAME: cebp
      SPRING_DATASOURCE_PASSWORD: cebp_secret
      TFNSW_API_KEY: ${TFNSW_API_KEY:-}

  worker-manager-service:
    build:
      context: .
      dockerfile: worker-manager-service/Dockerfile
    container_name: cebp-worker-manager
    profiles: ["full"]
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      WORKER_POOL_BASE_URL: http://analysis-worker:8091

  analysis-worker:
    build:
      context: .
      dockerfile: analysis-worker/Dockerfile
    container_name: cebp-analysis-worker
    profiles: ["full"]
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      WORKER_MANAGER_BASE_URL: http://worker-manager-service:8082

  analytics-results-service:
    build:
      context: .
      dockerfile: analytics-results-service/Dockerfile
    container_name: cebp-analytics-results
    profiles: ["full"]
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092

  mcp-agent-service:
    build:
      context: .
      dockerfile: mcp-agent-service/Dockerfile
    container_name: cebp-mcp-agent
    profiles: ["full"]
    depends_on:
      - core-management-service
      - worker-manager-service
      - analytics-results-service
    ports:
      - "8084:8084"
    environment:
      CORE_MANAGEMENT_BASE_URL: http://core-management-service:8081
      WORKER_MANAGER_BASE_URL: http://worker-manager-service:8082
      ANALYTICS_RESULTS_BASE_URL: http://analytics-results-service:8083
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: cebp-web-client
    profiles: ["full"]
    ports:
      - "3000:80"

volumes:
  core_postgres_data:
